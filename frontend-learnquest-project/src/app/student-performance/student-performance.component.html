<div class="container" *ngIf="estudianteSeleccionado as estudiante">
  <div class="sidebar">
    <h3>Estudiantes {{ nombreCurso }}</h3>
    <ul>
      <li *ngFor="let alumno of alumnos"
          (click)="seleccionarEstudiante(alumno)"
          [class.selected]="alumno.nombreAlumno === estudiante.nombreAlumno">
        {{ alumno.nombreAlumno }}
      </li>
    </ul>
  </div>

  <div class="carrusel">
    <h3>Alumno {{ estudiante.nombreAlumno }}</h3>
    <div class="info-extra">
      <div class="ultima-conexion">
        <div class="circle"></div>
        <span>
          Última conexión: {{ formatearFecha(estudiante.ultimaConexion) }}
        </span>
      </div>
      <div class="nivel-actual">
        <ng-container *ngIf="getNivelActual(estudiante); else completado">
          Actualmente en nivel {{ getNivelActual(estudiante) }}
        </ng-container>
        <ng-template #completado>
          Actualmente ha completado todos los niveles ✅
        </ng-template>
      </div>
    </div>

    <div class="botones-carrusel">
      <button (click)="paginaAnterior()" [disabled]="paginaActual === 0">←</button>
      <button (click)="paginaSiguiente()" [disabled]="paginaActual >= totalPaginas() - 1">→</button>
    </div>

    <div class="tarjetas">
      <app-student-level-card
        *ngFor="let nivel of nivelesPaginados(); let i = index"
        [nivel]="nivel"
        [backgroundUrl]="'assets/img' + (i + 1) + '.jpg'"
        class="tarjeta-container">
      </app-student-level-card>
    </div>
  </div>
</div>
